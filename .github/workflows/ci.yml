name: CI

on:
  pull_request:
    branches: [mvvm]
  push:
    branches: [mvvm]

jobs:
  build-and-test:
    runs-on: macos-latest

    env:
      PROJECT: MyTaiwanStock.xcodeproj
      SCHEME: MyTaiwanStock
      DESTINATION: platform=iOS Simulator,name=iPhone 17

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Swift Package dependencies
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT"

      - name: Build MyTaiwanStock
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -destination "$DESTINATION" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build StockWidgetExtension
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -target StockWidgetExtension \
            -sdk iphonesimulator \
            -destination "$DESTINATION" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build LiveActivityExtension
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -target LiveActivityExtension \
            -sdk iphonesimulator \
            -destination "$DESTINATION" \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -destination "$DESTINATION" \
            CODE_SIGNING_ALLOWED=NO
