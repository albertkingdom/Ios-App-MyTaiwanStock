name: TestFlight Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 45

    env:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_KEYCHAIN_NAME: signing.keychain-db
      MATCH_KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag originates from release branch
        if: github.event_name == 'push'
        run: |
          git fetch origin release
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/release; then
            echo "::error::Tag $GITHUB_REF_NAME does not point to a commit on the release branch. TestFlight releases via tag push must be tagged from release."
            exit 1
          fi

      - name: Set up SSH for match repo
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}

      - name: Trust GitHub host key
        run: mkdir -p ~/.ssh && ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Swift Package dependencies
        run: xcodebuild -resolvePackageDependencies -project MyTaiwanStock.xcodeproj

      # 只提醒不擋：tag 名稱不影響 App 版本，但兩者一致才能從 tag 對回 TestFlight 上的版本
      - name: Check tag matches MARKETING_VERSION
        if: github.event_name == 'push'
        run: |
          # 1.20 與 1.20.0 視為相同版本
          normalize() {
            local v="${1#v}"
            while [[ "$v" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)*\.0$ ]]; do v="${v%.0}"; done
            echo "$v"
          }
          marketing_version=$(xcodebuild -showBuildSettings -project MyTaiwanStock.xcodeproj \
            -target MyTaiwanStock -configuration Release 2>/dev/null \
            | awk '$1=="MARKETING_VERSION"{print $3; exit}')
          if [[ -z "$marketing_version" ]]; then
            echo "::warning::Could not read MARKETING_VERSION; skipping tag version check."
          elif [[ "$(normalize "$GITHUB_REF_NAME")" != "$(normalize "$marketing_version")" ]]; then
            message="Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $marketing_version. The build will still upload as $marketing_version."
            echo "::warning::$message"
            echo "⚠️ $message" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Tag $GITHUB_REF_NAME matches MARKETING_VERSION $marketing_version."
          fi

      - name: Install fastlane
        run: gem install fastlane

      - name: Set up signing keychain
        run: |
          security create-keychain -p "$MATCH_KEYCHAIN_PASSWORD" "$MATCH_KEYCHAIN_NAME"
          security set-keychain-settings -lut 3600 "$MATCH_KEYCHAIN_NAME"
          security unlock-keychain -p "$MATCH_KEYCHAIN_PASSWORD" "$MATCH_KEYCHAIN_NAME"
          security list-keychains -d user -s "$MATCH_KEYCHAIN_NAME" $(security list-keychains -d user | sed 's/"//g')
          security default-keychain -d user -s "$MATCH_KEYCHAIN_NAME"

      - name: Build and upload to TestFlight
        run: fastlane ios beta
